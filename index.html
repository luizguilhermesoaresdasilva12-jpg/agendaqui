<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGENDAQUI - Gerenciador de Agendamentos</title>
  <link rel="stylesheet" href="style.css">
  <!-- Fonte Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="navbar">
    <div class="logo">AGENDA<span>QUI</span></div>
    <p class="tagline">Agendamentos rápidos, simples e organizados</p>
  </header>

  <main class="container">
    <!-- Seção de Notificações/Alertas -->
    <div id="alert-box" class="alert hidden"></div>

    <div class="dashboard-grid">
      
      <!-- Painel Esquerdo: Formulários -->
      <section class="forms-wrapper">
        
        <!-- Formulário: Novo Agendamento -->
        <div class="card">
          <h2>Novo Agendamento</h2>
          <form id="form-agendamento">
            <div class="form-group">
              <label for="select-cliente">Cliente</label>
              <select id="select-cliente" required>
                <option value="">Selecione um cliente...</option>
              </select>
            </div>

            <div class="form-group">
              <label for="select-servico">Serviço</label>
              <select id="select-servico" required>
                <option value="">Selecione um serviço...</option>
              </select>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="data-agendamento">Data</label>
                <input type="date" id="data-agendamento" required>
              </div>

              <div class="form-group">
                <label for="hora-agendamento">Horário</label>
                <input type="time" id="hora-agendamento" required>
              </div>
            </div>

            <button type="submit" class="btn btn-primary">Agendar Atendimento</button>
          </form>
        </div>

        <!-- Formulário: Cadastrar Cliente -->
        <div class="card">
          <h2>Cadastrar Cliente</h2>
          <form id="form-cliente">
            <div class="form-group">
              <label for="nome-cliente">Nome Completo</label>
              <input type="text" id="nome-cliente" placeholder="Ex: Maria Silva" required>
            </div>
            <div class="form-group">
              <label for="telefone-cliente">Telefone / WhatsApp</label>
              <input type="tel" id="telefone-cliente" placeholder="(11) 99999-9999" required>
            </div>
            <button type="submit" class="btn btn-secondary">Salvar Cliente</button>
          </form>
        </div>

        <!-- Formulário: Cadastrar Serviço -->
        <div class="card">
          <h2>Cadastrar Serviço</h2>
          <form id="form-servico">
            <div class="form-group">
              <label for="nome-servico">Nome do Serviço</label>
              <input type="text" id="nome-servico" placeholder="Ex: Corte de Cabelo" required>
            </div>
            <div class="form-group">
              <label for="preco-servico">Preço (R$)</label>
              <input type="number" step="0.01" id="preco-servico" placeholder="0.00" required>
            </div>
            <button type="submit" class="btn btn-secondary">Salvar Serviço</button>
          </form>
        </div>

      </section>

      <!-- Painel Direito: Listagem dos Agendamentos -->
      <section class="appointments-wrapper">
        <div class="card full-height">
          <div class="card-header">
            <h2>Próximos Agendamentos</h2>
            <span class="badge" id="total-agendamentos">0 agendamentos</span>
          </div>

          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Data/Hora</th>
                  <th>Cliente</th>
                  <th>Serviço</th>
                  <th>Valor</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody id="tabela-agendamentos">
                <!-- Conteúdo preenchido via JS -->
              </tbody>
            </table>
            <div id="empty-state" class="empty-state">
              Nenhum agendamento cadastrado.
            </div>
          </div>
        </div>
      </section>

    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
